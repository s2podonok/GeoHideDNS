name: DNS Block & Redirect Configurer

on:
  schedule:
    # Запуск каждый день в 03:00 UTC (06:00 Москва)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  update-dns:
    runs-on: ubuntu-latest
    environment: DNS  # Ваше окружение, созданное ранее
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run updater script
        env:
          DNS_PROVIDER: ${{ vars.DNS }}
          REDIRECT_URLS: ${{ vars.REDIRECT }}
          BLOCK_URLS: ${{ vars.BLOCK }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          python - << 'EOF'
        import os
        import re
        import sys
        import requests
        import time

        def fetch_hosts(urls):
            """Скачивает и парсит hosts файлы"""
            domains = {}
            for url in urls:
                if not url or not url.strip():
                    continue
                try:
                    resp = requests.get(url.strip(), timeout=10)
                    if resp.status_code == 200:
                        for line in resp.text.splitlines():
                            line = line.strip()
                            if not line or line.startswith('#'):
                                continue
                            parts = line.split()
                            if len(parts) >= 2:
                                ip, domain = parts[0], parts[1]
                                # Если IP 0.0.0.0 или 127.0.0.1 — это блокировка
                                is_block = ip in ('0.0.0.0', '127.0.0.1')
                                if domain not in domains:
                                    domains[domain] = is_block
                                # Если домен уже есть и не был заблокирован, не перезаписываем
                    else:
                        print(f"Ошибка загрузки {url}: {resp.status_code}")
                except Exception as e:
                    print(f"Ошибка при загрузке {url}: {e}")
            return domains

        def update_nextdns(domains, auth_secret, client_id):
            """Обновляет NextDNS через API"""
            headers = {
                'X-Api-Key': auth_secret,
                'Content-Type': 'application/json'
            }
            
            # Получаем текущие deny/allow списки
            base_url = f"https://api.nextdns.io/profiles/{client_id}"
            
            # Сначала очищаем старые правила (если нужно)
            # Добавляем новые домены в deny list (блокировка) и rewrite (редирект)
            for domain, is_block in domains.items():
                if is_block:
                    # Добавляем в deny list
                    url = f"{base_url}/denylist"
                    data = [{"id": domain, "active": True}]
                else:
                    # Добавляем rewrite (перенаправление)
                    url = f"{base_url}/rewrites"
                    data = [{"domain": domain, "ip": "0.0.0.0"}]  # Можно сменить IP
                
                try:
                    # Проверяем, существует ли уже запись
                    resp_get = requests.get(url, headers=headers)
                    if resp_get.status_code == 200:
                        existing = resp_get.json().get('data', [])
                        exists = any(item.get('id') == domain or item.get('domain') == domain for item in existing)
                        if not exists:
                            resp_post = requests.post(url, headers=headers, json=data)
                            if resp_post.status_code not in (200, 201):
                                print(f"Ошибка добавления {domain}: {resp_post.status_code}")
                            else:
                                print(f"Добавлен: {domain} (block={is_block})")
                    time.sleep(0.5)  # Уважаем лимит NextDNS (1 запрос в секунду)
                except Exception as e:
                    print(f"Ошибка API для {domain}: {e}")

        def update_cloudflare(domains, auth_secret, client_id):
            """Обновляет Cloudflare Gateway"""
            # Здесь нужна реализация под Cloudflare
            print("Cloudflare пока не поддерживается в этом скрипте")
            pass

        # Основная логика
        provider = os.environ.get('DNS_PROVIDER', '').lower()
        auth = os.environ.get('AUTH_SECRET')
        client = os.environ.get('CLIENT_ID')
        
        if not auth or not client:
            print("Ошибка: AUTH_SECRET или CLIENT_ID не заданы")
            sys.exit(1)
        
        # Собираем URLs
        redirect_urls = os.environ.get('REDIRECT_URLS', '').split(',')
        block_urls = os.environ.get('BLOCK_URLS', '').split(',')
        
        all_urls = []
        # Для редиректов (не блокировка)
        if redirect_urls:
            all_urls.extend([u.strip() for u in redirect_urls if u.strip()])
        # Для блокировок
        if block_urls:
            all_urls.extend([u.strip() for u in block_urls if u.strip()])
        
        if not all_urls:
            print("Ошибка: нет URL для загрузки")
            sys.exit(1)
        
        print(f"Загружаем hosts из {len(all_urls)} источников")
        domains = fetch_hosts(all_urls)
        print(f"Получено {len(domains)} уникальных доменов")
        
        if provider == 'nextdns':
            update_nextdns(domains, auth, client)
        elif provider == 'cloudflare':
            update_cloudflare(domains, auth, client)
        else:
            print(f"Неподдерживаемый провайдер: {provider}")
            sys.exit(1)
        
        print("Готово!")
        EOF
